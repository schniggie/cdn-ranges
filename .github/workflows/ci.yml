name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['output/**']
  pull_request:
    paths-ignore: ['output/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/cdn-ranges ./cmd/cdn-ranges

      - name: Smoke test
        run: |
          /tmp/cdn-ranges -list
          /tmp/cdn-ranges -provider cloudflare -format csv -output /tmp/cloudflare.csv
          test "$(wc -l < /tmp/cloudflare.csv)" -gt 1
