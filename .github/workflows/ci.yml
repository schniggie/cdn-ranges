name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['output/**']
  pull_request:
    paths-ignore: ['output/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/cdn-ranges ./cmd/cdn-ranges

      - name: Smoke test
        run: |
          /tmp/cdn-ranges -list
          /tmp/cdn-ranges -provider cloudflare -format csv -output /tmp/cloudflare.csv
          test "$(wc -l < /tmp/cloudflare.csv)" -gt 1
